modules:
  achievement:
    enabled: true
  book_search:
    enabled: true
    default_search_count: 3

  chat_gpt:
    enabled: true
    ephemeral: false
    max_tokens: 1000
    model: gpt-5-mini-2025-08-07:free

  e621_search:
    enabled: true

  img_gen:
    enabled: true
    NSFW_filter: true

  logger:
    enabled: true

  manga:
    enabled: false
    default_search_count: 3

  music:
    enabled: false

  wishper:
    enabled: false

  temp_channels:
    enabled: false
    time_to_delete: 1

  reports:
    enabled: true
    logs_level: 1
    time_to_delete: 60

  moderation:
    enabled: true

  fun:
    enabled: true

  guard:
    enabled: true
    sensitivity: 1
    message_limit: 3
    time_limit: 10
    whitelist:
      - 'youtube.com'
      - 'twitch.tv'
      - 'twitch.com'
      - 'online-fix.me'
      - 'music.youtube.com'
      - 'google.com'
      - 'github.com'
      - 'dreamerscast.com'
      - 'hentailib.me'
      - 'mangalib.me'
      - 'ranobelib.me'
      - 'freetp.org'
      - 'ozon.ru'
      - 'e621.net'
      - 'youtu.be'

  analytics:
    enabled: true
    logs_interval: 5
    max_entries: 20